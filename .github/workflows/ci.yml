name: CI Omni-Calculateur

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier la syntaxe JavaScript et Python
        run: |
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find . -path ./node_modules -prune -o -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          python3 -B -c "import ast; ast.parse(open('tools/build.py', encoding='utf-8').read())"

      - name: Tests unitaires du moteur de calcul
        run: node tests/unit.test.mjs

      - name: Contrôles statiques (SW, PNG, charte)
        run: node tests/verifier-statique.mjs

      - name: Installer Playwright (sans modifier le dépôt)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Tests E2E Playwright
        env:
          CI: 'true'
        run: node tests/tester.js

      - name: Vérifier que le dépôt reste propre
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
